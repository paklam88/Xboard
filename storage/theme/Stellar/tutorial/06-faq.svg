<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="702" viewBox="0 0 720 702">
  <rect width="720" height="702" rx="24" fill="#020617"/>
  <rect x="0" y="0" width="720" height="100" fill="#020617"/>
  <text x="24" y="64" font-size="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">常见问题（小白）</text>

  <rect x="24" y="120" width="672" height="128" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="68" cy="184.0" r="30" fill="#ef4444"/>
  <text x="68" y="195.0" text-anchor="middle" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#fff" font-weight="800">1</text>
  <text x="114" y="160" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">复制了但导入失败</text>
  <text x="114" y="194" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#cbd5e1">重新复制，确认开头是 http/https</text>

  <rect x="24" y="262" width="672" height="128" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="68" cy="326.0" r="30" fill="#ef4444"/>
  <text x="68" y="337.0" text-anchor="middle" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#fff" font-weight="800">2</text>
  <text x="114" y="302" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">没有节点 / 更新失败</text>
  <text x="114" y="336" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#cbd5e1">先确认套餐有效，再点更新</text>

  <rect x="24" y="404" width="672" height="128" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="68" cy="468.0" r="30" fill="#ef4444"/>
  <text x="68" y="479.0" text-anchor="middle" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#fff" font-weight="800">3</text>
  <text x="114" y="444" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">开了开关上不了网</text>
  <text x="114" y="478" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#cbd5e1">换一个节点，或开关重开一次</text>

  <rect x="24" y="546" width="672" height="128" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="68" cy="610.0" r="30" fill="#ef4444"/>
  <text x="68" y="621.0" text-anchor="middle" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#fff" font-weight="800">4</text>
  <text x="114" y="586" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">找不到下载入口</text>
  <text x="114" y="620" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#cbd5e1">打开知识库「下载客户端」</text>

</svg>
