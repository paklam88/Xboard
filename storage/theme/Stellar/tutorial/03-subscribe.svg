<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="702" viewBox="0 0 720 702">
  <rect width="720" height="702" rx="24" fill="#020617"/>
  <rect x="0" y="0" width="720" height="100" fill="#020617"/>
  <text x="24" y="64" font-size="34" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">购买订阅（小白流程）</text>

  <rect x="24" y="120" width="672" height="128" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="68" cy="184.0" r="30" fill="#f59e0b"/>
  <text x="68" y="195.0" text-anchor="middle" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#fff" font-weight="800">1</text>
  <text x="114" y="160" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">登录后打开套餐</text>
  <text x="114" y="194" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#cbd5e1">用户中心 →「套餐/商店」</text>

  <rect x="24" y="262" width="672" height="128" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="68" cy="326.0" r="30" fill="#f59e0b"/>
  <text x="68" y="337.0" text-anchor="middle" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#fff" font-weight="800">2</text>
  <text x="114" y="302" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">选择套餐周期</text>
  <text x="114" y="336" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#cbd5e1">按流量和时长挑选</text>

  <rect x="24" y="404" width="672" height="128" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="68" cy="468.0" r="30" fill="#f59e0b"/>
  <text x="68" y="479.0" text-anchor="middle" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#fff" font-weight="800">3</text>
  <text x="114" y="444" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">下单并支付</text>
  <text x="114" y="478" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#cbd5e1">按页面提示付款（需后台已配支付）</text>

  <rect x="24" y="546" width="672" height="128" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="68" cy="610.0" r="30" fill="#f59e0b"/>
  <text x="68" y="621.0" text-anchor="middle" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#fff" font-weight="800">4</text>
  <text x="114" y="586" font-size="28" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#f8fafc" font-weight="800">确认已生效</text>
  <text x="114" y="620" font-size="22" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#cbd5e1">仪表盘能看到到期时间和流量</text>

